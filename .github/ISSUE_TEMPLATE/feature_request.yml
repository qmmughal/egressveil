name: Feature request
description: Suggest a detector, integration, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to protect against or achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this widen what EgressVeil forwards, logs, or exposes?
