name: Release

# Pushing a tag like v0.2.0 builds the sdist and wheel, records signed build
# provenance, and creates a GitHub release with the files attached.
#
# PyPI publishing uses Trusted Publishing (OIDC, no API tokens). It only runs
# when the repository variable PYPI_PUBLISH is "true", and it needs approval
# in the "pypi" environment. To set it up once, see docs/releasing.md. After
# that, publish an existing tag by running this workflow FROM THE TAG
# (gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z); the pypi
# environment only accepts v* tags.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check tag format and that it matches the package version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/egressveil/__init__.py').read_text()).group(1))")
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match package version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
      - name: Run the test suite
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          rm -rf dist
          python -m build
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/rel
          /tmp/rel/bin/python -m pip install dist/*.whl
          /tmp/rel/bin/egressveil version | grep -q "${TAG#v}"
          /tmp/rel/bin/egressveil doctor
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, pathlib, re
          version = os.environ["TAG"][1:]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]\n]+\]: |\Z)",
              text, re.S | re.M,
          )
          pathlib.Path("dist-notes.md").write_text(m.group(1).strip() + "\n", encoding="utf-8")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign provenance (Sigstore)
      attestations: write # store provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EgressVeil $TAG" \
            --notes-file dist-notes.md \
            --verify-tag \
            --prerelease

  pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/egressveil/
    permissions:
      id-token: write # Trusted Publishing; no stored API token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
