# EgressVeil example configuration.
#
# Copy to ./egressveil.yaml or to your user config directory and adjust:
#   Windows: %APPDATA%\egressveil\egressveil.yaml
#   macOS:   ~/Library/Application Support/egressveil/egressveil.yaml
#   Linux:   ${XDG_CONFIG_HOME:-~/.config}/egressveil/egressveil.yaml
#
# Validate with:  egressveil config validate --config path/to/egressveil.yaml
#
# NEVER put API keys or other credentials in this file. Your agent keeps
# using its own credentials; EgressVeil forwards the Authorization header
# untouched. `config validate` rejects files that appear to contain secrets.
#
# Run the gateway with:  egressveil serve --config path/to/egressveil.yaml
# Or run an agent through it:  egressveil run -- claude
# Policies, allowlists, extends and response inspection: docs/policies.md

version: 1

# Build on other config files (merged first, this file wins). "user" means
# your user config; handy in a project's ./egressveil.yaml.
# extends:
#   - user
#   - ../security/egressveil-team.yaml

gateway:
  # Loopback only by default. Non-loopback addresses are rejected unless
  # allow_non_loopback is explicitly set to true.
  listen_host: 127.0.0.1
  listen_port: 8787
  # strict: block requests EgressVeil cannot parse or inspect (fail closed).
  # permissive: forward them with an audit event (evaluation only).
  mode: strict
  allow_non_loopback: false
  max_request_body_bytes: 16777216   # 16 MiB
  max_stream_buffer_bytes: 1048576   # 1 MiB
  # Images and PDFs (base64) cannot be inspected. In strict mode they are
  # blocked unless this is true. Text in the same request is still inspected.
  allow_opaque_content: false
  # How to reach the upstream API: none (direct, default), env (honour
  # HTTPS_PROXY / NO_PROXY), or an explicit http(s)://host:port proxy.
  # Proxy credentials belong in the environment (use env), never here.
  upstream_proxy: none
  # Scan model responses too (audit only; responses are never modified).
  inspect_responses: false

# Upstream endpoints. Hosts must be on the built-in provider allowlist
# unless allow_custom_upstream is set for that provider. https:// only.
providers:
  anthropic:
    enabled: true
    upstream_url: https://api.anthropic.com
  # OpenAI-compatible APIs are served under /openai:
  #   OPENAI_BASE_URL=http://127.0.0.1:8787/openai/v1
  openai:
    enabled: false
    upstream_url: https://api.openai.com

policy:
  # balanced (default) | redact (keeps interactive sessions flowing)
  # | strict | audit (log only, for evaluation)
  pack: balanced
  # Applied to findings from detectors with no explicit rule.
  # One of: ALLOW, REDACT, BLOCK, LOG_ONLY
  default_action: REDACT
  # Rules override the pack per detector.
  rules:
    - detector: secrets
      action: BLOCK
    - detector: tokens
      action: BLOCK
    - detector: pii
      action: REDACT
    - detector: internal_hostnames
      action: REDACT
  # Suppress checked false positives. Digests come from the audit log or
  # `egressveil scan`; never put the value itself here.
  allow:
    - rule: private_ipv4
      comment: example entry; remove if you enable include_private_ips

detectors:
  secrets:
    enabled: true
  tokens:
    enabled: true
  pii:
    enabled: true
  internal_hostnames:
    enabled: true
    internal_domains:
      - corp.example.com
      - internal.example
    # Also flag hosts under .internal .corp .intranet .lan .home.arpa
    include_common_internal_suffixes: true
    # Flag RFC 1918 addresses (10/8, 172.16/12, 192.168/16). Off by default:
    # example code is full of them.
    include_private_ips: false

audit:
  enabled: true
  path: ~/.egressveil/audit.jsonl
  # Raw sensitive values are never logged. Setting this to true is rejected.
  include_raw_values: false

telemetry:
  # EgressVeil has no telemetry. This key exists only to make that explicit.
  enabled: false
