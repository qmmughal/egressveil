[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "egressveil"
dynamic = ["version"]
description = "The local privacy gateway for AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "EgressVeil contributors" }]
keywords = ["security", "privacy", "llm", "ai-agents", "dlp", "redaction", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0.1",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.2",
    "pip-audit>=2.7",
    "jsonschema>=4.22",
    "hypothesis>=6.100",
]

[project.scripts]
egressveil = "egressveil.cli:main"

[project.urls]
Homepage = "https://github.com/qmmughal/egressveil"
Issues = "https://github.com/qmmughal/egressveil/issues"
Changelog = "https://github.com/qmmughal/egressveil/blob/main/CHANGELOG.md"
Security = "https://github.com/qmmughal/egressveil/blob/main/SECURITY.md"

[tool.hatch.version]
path = "src/egressveil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/egressveil"]

[tool.hatch.build.targets.sdist]
include = [
    "src/egressveil",
    "tests",
    "configs",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "C4",       # comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SIM117"]  # assert is how pytest works; nested async-with reads better
"scripts/**" = ["S101"]  # dev scripts may assert

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/egressveil"]
